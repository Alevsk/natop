services:
  natop:
    build: .
    image: ${NATOP_IMAGE:-natop:local}
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
    entrypoint: ["natop", "--config", "/config/connections.yaml"]
    volumes:
      - type: bind
        source: ${NATOP_CONFIG:-./examples/connections.yaml}
        target: /config/connections.yaml
        read_only: true
